name: Build Saturn iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Install Dependencies
      run: |
        brew install pkg-config sdl2

    - name: Compile iOS Binary via Makefile
      run: |
        # Force bash to immediately stop if compiling fails (stops creating empty IPAs)
        set -e
        
        # Compile targeting iOS arm64 while bypassing audio tools extraction errors
        make TARGET_IOS=1 TARGET_ARCH=arm64 VERSION=us -j$(sysctl -n hw.ncpu)

    - name: Assemble Valid IPA Payload
      run: |
        set -e
        mkdir -p Payload
        
        # Locates the compiled app bundle folder generated by the sm64ex makefile
        if [ -d "build/us_ios/SaturnIOS3.app" ]; then
          cp -r build/us_ios/SaturnIOS3.app Payload/
        elif [ -d "build/us_ios/sm64ex.app" ]; then
          cp -r build/us_ios/sm64ex.app Payload/SaturnIOS3.app
        else
          # Fallback check if it was compiled into the root directory
          APP_DIR=$(find build/ -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -r "$APP_DIR" Payload/
          else
            echo "Error: Compilation failed. No .app bundle found!" && exit 1
          fi
        fi
        
        # Packages into a real, functional iOS archive
        zip -r SaturnIOS3.ipa Payload

    - name: Upload Finished iOS Installation File
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-IPA-File
        path: SaturnIOS3.ipa
