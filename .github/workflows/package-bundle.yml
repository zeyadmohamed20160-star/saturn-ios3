name: Robust iOS IPA Packager and Verifier

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-robust-ipa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate and Run Deep Packaging Script
        run: |
          cat << 'EOF' > make_ipa_robust.py
          import os
          import shutil
          import zipfile
          import stat

          print("==================================================")
          print("   STARTING ROBUST iOS IPA PACKAGING & VERIFICATION ")
          print("==================================================")

          payload_dir = "Payload"
          app_name = os.path.join(payload_dir, "MyApplication.app")

          # Step 1: Clean slate cleanup
          if os.path.exists(payload_dir):
              print(f"[-] Removing existing '{payload_dir}' directory...")
              shutil.rmtree(payload_dir)
          if os.path.exists("MyApplication.ipa"):
              print("[-] Removing existing 'MyApplication.ipa'...")
              os.remove("MyApplication.ipa")

          # Step 2: Create strict iOS .app hierarchy
          print(f"[+] Creating iOS bundle directory structure at: {app_name}")
          os.makedirs(app_name, exist_ok=True)

          # Step 3: Bundle required asset and source folders
          expected_folders = [
              "actors", "assets", "levels", "sound", "lib", 
              "dynos", "fonts", "include", "bin", "data", "src"
          ]

          found_folders_count = 0
          for folder in expected_folders:
              if os.path.exists(folder) and os.path.isdir(folder):
                  dest_folder = os.path.join(app_name, folder)
                  shutil.copytree(folder, dest_folder, dirs_exist_ok=True)
                  print(f"    [OK] Successfully bundled asset folder -> '{folder}'")
                  found_folders_count += 1
              else:
                  print(f"    [INFO] Optional folder '{folder}' not found in repo root (skipping).")

          print(f"[+] Total asset folders bundled: {found_folders_count}")

          # Step 4: Locate and secure executable binary
          # Note: iOS requires an ARM64 binary. Windows executables (.exe) will crash or throw errors on iOS.
          binary_candidates = ["MyApplication", "sm64.us.f3dex2", "sm64", "sm64.elf", "sm64.us.exe"]
          binary_placed = False

          for candidate in binary_candidates:
              if os.path.exists(candidate) and not os.path.isdir(candidate):
                  dest_bin = os.path.join(app_name, "MyApplication")
                  shutil.copy(candidate, dest_bin)
                  
                  # CRITICAL FIX: Grant explicit read, write, and execute permissions (chmod 755)
                  os.chmod(dest_bin, stat.S_IRWXU | stat.S_IRGRP | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)
                  
                  print(f"    [OK] Found and bundled executable binary from: '{candidate}' -> copied as 'MyApplication'")
                  if candidate.endswith(".exe"):
                      print("    [WARNING] You bundled a Windows .exe file! iOS devices cannot execute Windows binaries natively.")
                  binary_placed = true
                  break

          if not binary_placed:
              print("    [WARNING] No executable binary found! Creating a dummy shell script placeholder to satisfy bundle requirements.")
              placeholder_path = os.path.join(app_name, "MyApplication")
              with open(placeholder_path, "w") as f:
                  f.write("#!/bin/sh\necho 'Placeholder Binary'\n")
              os.chmod(placeholder_path, stat.S_IRWXU | stat.S_IRGRP | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)

          # Step 5: Generate valid, clean iOS Info.plist
          plist_path = os.path.join(app_name, "Info.plist")
          plist_content = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>MyApplication</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.supermario64port</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>MyApplication</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          """
          # Clean up any potential extra indentation spaces from multi-line block
          cleaned_plist = "\n".join([line.strip() for line in plist_content.strip().split("\n")])
          with open(plist_path, "w", encoding="utf-8") as f:
              f.write(cleaned_plist + "\n")
          print(f"    [OK] Generated clean Info.plist at: {plist_path}")

          # Step 6: Print full tree layout for absolute visibility in logs
          print("\n[+] Verifying generated .app directory contents:")
          total_files_tracked = 0
          for root, dirs, files in os.walk(app_name):
              level = root.replace(app_name, "").count(os.sep)
              indent = " " * 4 * level
              print(f"{indent}{os.path.basename(root)}/")
              sub_indent = " " * 4 * (level + 1)
              for f in files:
                  print(f"{sub_indent}{f}")
                  total_files_tracked += 1

          print(f"\n[+] Total files included in bundle: {total_files_tracked}")

          # Step 7: Compress into a clean .ipa zip archive using Python zipfile
          ipa_filename = "MyApplication.ipa"
          print(f"\n[+] Compressing package into '{ipa_filename}'...")
          
          with zipfile.ZipFile(ipa_filename, "w", zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(payload_dir):
                  for file in files:
                      # Exclude unwanted OS junk files that cause sideloading tool corruption errors
                      if file == ".DS_Store" or file.startswith("._") or file.endswith(".pyc"):
                          continue
                      file_path = os.path.join(root, file)
                      # Ensure standard Unix-style paths in the zip archive
                      arcname = os.path.relpath(file_path, start=".")
                      arcname = arcname.replace("\\", "/")
                      zipf.write(file_path, arcname)

          print(f"==================================================")
          print(f"   SUCCESS! IPA CREATED: {ipa_filename}           ")
          print(f"==================================================")
          EOF

      - name: Execute Packaging Script
        run: python3 make_ipa_robust.py

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Package-Robust
          path: MyApplication.ipa
