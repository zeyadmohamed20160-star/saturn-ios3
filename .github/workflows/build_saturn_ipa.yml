name: Build Saturn iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Configure Asset Extraction
      run: |
        # Injects or extracts the mandatory asset systems if script exists
        if [ -f "extract_assets.py" ]; then
          python3 extract_assets.py us
        fi

    - name: Compile Native iOS App via Xcode Engine
      run: |
        # Uses the real Apple xcodebuild engine targeting physical iOS devices (arm64)
        xcodebuild -project SaturnIOS3.xcodeproj \
                   -scheme SaturnIOS3 \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Assemble Valid IPA Payload
      run: |
        mkdir -p Payload
        
        # Locates the authentic ARM64 build output directory from Xcode
        if [ -d "build/Release-iphoneos/SaturnIOS3.app" ]; then
          cp -r build/Release-iphoneos/SaturnIOS3.app Payload/
        else
          # Fallback lookup for standard Xcode DerivedData pathways
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SaturnIOS3.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            echo "Error: Native iOS .app binary not found!" && exit 1
          fi
        fi
        
        # Bundles the payload directory into a genuine installable iOS .ipa archive
        zip -r SaturnIOS3.ipa Payload

    - name: Upload Finished iOS Installation File
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-IPA-File
        path: SaturnIOS3.ipa
