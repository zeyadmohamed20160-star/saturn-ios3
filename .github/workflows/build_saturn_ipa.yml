name: Build Saturn iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Install Dependencies
      run: |
        brew install pkg-config sdl2

    - name: Fix Script Permissions
      run: |
        chmod +x pcbuilder.sh || true
        if [ -f "tools/preprocess" ]; then chmod +x tools/preprocess || true; fi

    - name: Compile iOS Binary via Makefile
      run: |
        set -e
        
        # 1. Grab the exact compiler and linker flags for Homebrew's SDL2 setup
        SDL_CFLAGS=$(pkg-config --cflags sdl2)
        SDL_LDFLAGS=$(pkg-config --libs sdl2)
        
        # 2. Export build targets as true system variables so the Makefile switches to iOS mode
        export TARGET_IOS=1
        export TARGET_ARCH=arm64
        export VERSION=us
        
        # 3. Run compilation, forcing the include flags to combine the custom clang preprocessor and SDL2
        make CPP="clang -E -P -xc" \
             EXT_C_FLAGS="$SDL_CFLAGS" \
             EXT_L_FLAGS="$SDL_LDFLAGS" \
             -j$(sysctl -n hw.ncpu)

    - name: Assemble Valid IPA Payload
      run: |
        set -e
        mkdir -p Payload
        
        # Checks the correct iOS output paths generated by the target build architecture
        if [ -d "build/us_ios/SaturnIOS3.app" ]; then
          cp -r build/us_ios/SaturnIOS3.app Payload/
        elif [ -d "build/us_ios/sm64ex.app" ]; then
          cp -r build/us_ios/sm64ex.app Payload/SaturnIOS3.app
        else
          APP_DIR=$(find build/ -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -r "$APP_DIR" Payload/
          else
            echo "Error: Compilation failed. No .app bundle found!" && exit 1
          fi
        fi
        
        zip -r SaturnIOS3.ipa Payload

    - name: Upload Finished iOS Installation File
      uses: actions/upload-artifact@v4
      with:
        name: Saturn-iOS-IPA-File
        path: SaturnIOS3.ipa
