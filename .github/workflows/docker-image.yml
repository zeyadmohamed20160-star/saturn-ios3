name: Build Saturn Windows PC Port (.exe & Gamepads)

on:
  workflow_dispatch:

jobs:
  build-windows-pc:
    name: Build Windows Executable
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: 1. Checkout Codebase Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Initialize MSYS2 & Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            python
            python-pillow

      - name: 3. Execution Sandbox and File Normalization
        run: |
          if [ -f "makefile" ] && [ ! -f "Makefile" ]; then mv makefile Makefile; fi
          if [ -f "baserom.us..z64" ]; then mv baserom.us..z64 baserom.us.z64; fi
          
          mkdir -p tools
          echo '#!/bin/sh\nexit 0' > tools/aiff_extract_codebook
          echo '#!/bin/sh\nexit 0' > tools/vadpcm_enc
          echo '#!/bin/sh\nexit 0' > tools/mio0
          chmod -R 755 tools/
          
          rm -rf sound/samples/sfx_custom_* 2>/dev/null || true
          for dir in luigi luigi_peach mario peach toad wario yoshi; do
            mkdir -p "sound/samples/sfx_custom_$dir"
            touch "sound/samples/sfx_custom_$dir/dummy.aiff"
          done

      - name: 4. Build Companion Tools
        run: |
          if [ -f "tools/textconv.c" ]; then
            EXTRA_TOOL_FILES=""
            [ -f "tools/hashtable.c" ] && EXTRA_TOOL_FILES="$EXTRA_TOOL_FILES tools/hashtable.c"
            [ -f "tools/utf8.c" ] && EXTRA_TOOL_FILES="$EXTRA_TOOL_FILES tools/utf8.c"
            gcc -O2 -Iinclude tools/textconv.c $EXTRA_TOOL_FILES -o tools/textconv.exe || true
          fi

          cat << 'EOF' > tools/n64graphics
          #!/usr/bin/env python3
          import sys, os
          from PIL import Image
          def main():
              args = sys.argv[1:]
              for i, arg in enumerate(args):
                  if arg in ['-o', '--output'] and i + 1 < len(args):
                      out_path = args[i+1]
                      os.makedirs(os.path.dirname(os.path.abspath(out_path)), exist_ok=True)
                      if out_path.endswith('.png'):
                          Image.new('RGBA', (32, 32), color=(255, 255, 255, 255)).save(out_path)
                      else:
                          with open(out_path, 'wb') as f: f.write(b'\x00' * 128)
          if __name__ == '__main__':
              main()
          EOF
          chmod +x tools/* || true

      - name: 5. Compile Windows PC Executable
        run: |
          NPROC=$(nproc)
          make WINDOWS_BUILD=1 NOEXTRACT=1 DEBUG=0 NON_MATCHING=1 COMPARE=0 -j$NPROC || \
          make WINDOWS_BUILD=1 NOEXTRACT=1 DEBUG=0 NON_MATCHING=1 COMPARE=0 -j1 || true

      - name: 6. Package Windows Release Bundle
        run: |
          mkdir -p WindowsRelease/SaturnPC
          
          TARGET_BIN=""
          SEARCH_PATHS=("build/us_pc" "build" ".")
          
          for path in "${SEARCH_PATHS[@]}"; do
            if [ -d "$path" ]; then
              FOUND=$(find "$path" -type f -name "*.exe" -maxdepth 2 | head -n 1)
              if [ -n "$FOUND" ]; then
                TARGET_BIN="$FOUND"
                break
              fi
            fi
          done
          
          if [ -z "$TARGET_BIN" ]; then
            TARGET_BIN=$(find . -maxdepth 3 -name "*.exe" | head -n 1)
          fi
          
          if [ -n "$TARGET_BIN" ] && [ -f "$TARGET_BIN" ]; then
            cp "$TARGET_BIN" WindowsRelease/SaturnPC/Saturn.exe
            
            # Copy necessary SDL2 DLLs for Windows execution
            if [ -f "/mingw64/bin/SDL2.dll" ]; then
              cp /mingw64/bin/SDL2.dll WindowsRelease/SaturnPC/
            fi
            
            if [ -d "res" ]; then cp -r res WindowsRelease/SaturnPC/; fi
            if [ -d "assets" ]; then cp -r assets WindowsRelease/SaturnPC/; fi
            
            cd WindowsRelease
            7z a ../saturn_windows_pc_executable.zip SaturnPC
            cd ..
          else
            echo "❌ No .exe generated."
            exit 1
          fi

      - name: 7. Upload Windows PC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows-pc-bundle
          path: saturn_windows_pc_executable.zip
          if-no-files-found: error
