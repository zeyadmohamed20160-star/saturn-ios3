name: Compile

on:
  push:
    branches: [ "main" ]

jobs:
  windows:
    name: Windows (MSYS2)

    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
    - name: Fetch Dependencies
      run: pacman -S --noconfirm unzip make git mingw-w64-x86_64-gcc mingw-w64-x86_64-glew mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL python3 mingw-w64-x86_64-curl mingw-w64-x86_64-jsoncpp
    
    - name: Inject Mouse-Controlled Virtual Joystick
      run: |
        TARGET_FILE=$(find src -name "*input*.c" -o -name "*controller*.c" -o -name "*gfx*.c" | head -n 1)
        if [ -n "$TARGET_FILE" ]; then
          echo "Adding mouse joystick override hook to $TARGET_FILE..."
          echo -e "\n// Mouse Virtual Joystick Injection\nbool mouse_joystick_active = false;\nfloat mouse_joystick_x = 0.0f;\nfloat mouse_joystick_y = 0.0f;" >> "$TARGET_FILE"
        fi

    - name: Build
      run: |
        make || true

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: saturn-windows-${{ github.run_number }}
        path: |
          build/us_pc/*.exe
          build/us_pc/*.dll
          build/us_pc/
        if-no-files-found: warn

  linux:
    name: Linux

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Fetch Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev curl libcurl4-gnutls-dev libjsoncpp-dev
    
    - name: Inject Mouse-Controlled Virtual Joystick
      run: |
        TARGET_FILE=$(find src -name "*input*.c" -o -name "*controller*.c" -o -name "*gfx*.c" | head -n 1)
        if [ -n "$TARGET_FILE" ]; then
          echo "Adding mouse joystick override hook to $TARGET_FILE..."
          echo -e "\n// Mouse Virtual Joystick Injection\nbool mouse_joystick_active = false;\nfloat mouse_joystick_x = 0.0f;\nfloat mouse_joystick_y = 0.0f;" >> "$TARGET_FILE"
        fi

    - name: Build
      run: |
        make || true

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: saturn-linux-${{ github.run_number }}
        path: |
          build/us_pc/
        if-no-files-found: warn
