name: Build Saturn iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run iOS Compiler & IPA Packager
        run: python build_ios.py

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaturnCompletePackage
          path: SaturnCompletePackage.ipa
