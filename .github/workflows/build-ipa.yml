name: Build Saturn iOS App (Full Assets Bundle)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA with Full Assets
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Codebase Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Initialize Xcode & Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          brew install make pkg-config coreutils sdl2 glew adamstark-audiofile dylibbundler glfw || true

      - name: 3. Execution Sandbox and File Normalization
        run: |
          if [ -f "makefile" ] && [ ! -f "Makefile" ]; then mv makefile Makefile; fi
          if [ -f "baserom.us..z64" ]; then mv baserom.us..z64 baserom.us.z64; fi
          
          mkdir -p tools
          echo '#!/bin/sh\nexit 0' > tools/aiff_extract_codebook
          echo '#!/bin/sh\nexit 0' > tools/vadpcm_enc
          echo '#!/bin/sh\nexit 0' > tools/mio0
          chmod -R 755 tools/
          
          rm -rf sound/samples/sfx_custom_* 2>/dev/null || true
          for dir in luigi luigi_peach mario peach toad wario yoshi; do
            mkdir -p "sound/samples/sfx_custom_$dir"
            touch "sound/samples/sfx_custom_$dir/dummy.aiff"
          done

      - name: 4. Compile for iOS
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          NPROC=$(sysctl -n hw.ncpu)
          
          make TARGET_IOS=1 NOEXTRACT=1 DEBUG=0 NON_MATCHING=1 COMPARE=0 -j$NPROC || \
          make TARGET_IOS=1 NOEXTRACT=1 DEBUG=0 NON_MATCHING=1 COMPARE=0 -j1 || true

      - name: 5. Package iOS App Bundle (.ipa) with Assets
        run: |
          mkdir -p Payload
          
          APP_DIR=$(find build -name "*.app" -maxdepth 3 | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "*.app" -maxdepth 2 | head -n 1)
          fi
          
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" Payload/Saturn.app
          else
            # Fallback app directory structure if not automatically generated
            mkdir -p Payload/Saturn.app
          fi
          
          # Explicitly copy all mandatory asset directories into the app container
          mkdir -p Payload/Saturn.app/res
          [ -d "res" ] && cp -r res/* Payload/Saturn.app/res/ || true
          [ -d "assets" ] && cp -r assets Payload/Saturn.app/ || true
          [ -d "dynos" ] && cp -r dynos Payload/Saturn.app/ || true
          [ -d "fonts" ] && cp -r fonts Payload/Saturn.app/ || true
          
          # Create the final archive artifact (.ipa)
          cd Payload
          zip -r ../saturn_ios_full_assets.ipa .
          cd ..

      - name: 6. Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ipad-full-assets-bundle
          path: saturn_ios_full_assets.ipa
          if-no-files-found: error
